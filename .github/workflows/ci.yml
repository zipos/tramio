name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Test coverage (engine thresholds)
        run: npm run test:coverage

      - name: Validate content packs (default level)
        run: npm run validate:packs

      - name: Expo config smoke check
        run: npm run expo:check-config

      # --strict is the human-review release gate. It is expected to fail
      # until a reviewer approves all narrative frontmatter (poiId, language,
      # claims[], review block). Run as informational only — does NOT block CI.
      - name: Validate content packs (strict — informational)
        run: npm run validate:packs:strict || true
